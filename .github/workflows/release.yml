# Builds a fully static lyngdorf_bridge for arm64 (musl + libusb) and attaches it
# to a GitHub release.
#
# Trigger: push a version tag, for example:
#   git tag v1.0.0 && git push origin v1.0.0
# The release is created automatically if it does not exist yet.
#
# A manual run (Actions tab -> Release -> Run workflow) only builds the binary and
# keeps it as a downloadable workflow artifact; it does not create a release.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build static binary in Alpine (musl)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e LIBUSB_VERSION=1.0.27 \
            alpine:3.20 sh scripts/build-static.sh

      - name: Keep binary as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyngdorf_bridge-linux-arm64
          path: dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes-file .github/release-notes.md
          gh release upload "$TAG" dist/* --clobber
